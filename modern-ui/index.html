<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Phone Book Modern UI - Fast, accessible, and responsive contact management application powered by IndexedDB & Bootstrap 5.">
    <meta name="color-scheme" content="dark light">
    <title>Phone Book (Modern UI) - Bootstrap 5</title>

    <!-- Bootstrap 5.3.3 & Icons -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="../Assets/css/all.min.css" />
    <link rel="stylesheet" href="css/searchbox.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <div class="jumbotron jum">

        <header class="navbar flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <div class="d-flex align-items-center gap-3">
                <h1 class="h3 m-0 d-flex align-items-center gap-2">
                    <span>Phone Book</span>
                    <i class="far fa-address-book text-info"></i>
                    <span class="badge bg-info-subtle text-info border border-info-subtle fs-6 rounded-pill ms-2">v2 Modern</span>
                </h1>
            </div>

            <!-- Controls: Theme Toggle & Switch to Classic UI -->
            <div class="d-flex align-items-center gap-2">
                <button type="button" id="themeToggle" class="btn btn-outline-secondary btn-sm rounded-circle p-2" aria-label="Toggle dark/light theme" title="Toggle theme">
                    <i id="themeIcon" class="fas fa-moon"></i>
                </button>
                <a href="../" class="btn btn-outline-info btn-sm d-flex align-items-center gap-1" title="Switch to Classic UI">
                    <i class="fas fa-history"></i>
                    <span class="d-none d-sm-inline">Classic UI</span>
                </a>
            </div>

            <form id="searchForm" onsubmit="return false;" class="wrap">
                <div class="search">
                    <label for="myInput" class="visually-hidden">Search contacts</label>
                    <input type="text" id="myInput" class="searchTerm" name="search" placeholder="What Contact are you looking for?" aria-label="Search contacts" autocomplete="off" spellcheck="false">
                    <button type="submit" class="searchButton" aria-label="Search">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
            </form>
        </header>

        <div class="row g-4">

            <!-- Add Contact Form -->
            <div class="col-lg-4 inp">
                <div class="card p-3 border-0" style="background-color: var(--card-subtle-bg, rgba(15, 23, 42, 0.55)); border-radius: 12px;">
                    <h5 class="mt-1 mb-3 fw-bold d-flex align-items-center gap-2">
                        <i class="fas fa-user-plus text-info"></i> Add New Contact
                    </h5>

                    <form id="addForm" onsubmit="return false;">
                        <div class="form-outline mt-2">
                            <input type="text" id="userName" name="name" class="form-control" autocomplete="name" />
                            <label class="form-label" for="userName">Name</label>
                            <div class="form-notch">
                                <div class="form-notch-leading"></div>
                                <div class="form-notch-middle"></div>
                                <div class="form-notch-trailing"></div>
                            </div>
                        </div>
                        <div id="nameAlert" class="alert alert-danger p-2 mt-1" style="display:none; font-size: 0.85rem;">Please add a valid name (2-50 characters)</div>

                        <div class="form-outline mt-3">
                            <input type="number" id="userPhone" name="phone" class="form-control" min="0" max="999999999999" inputmode="numeric" autocomplete="tel" />
                            <label class="form-label" for="userPhone">Phone</label>
                            <div class="form-notch">
                                <div class="form-notch-leading"></div>
                                <div class="form-notch-middle"></div>
                                <div class="form-notch-trailing"></div>
                            </div>
                        </div>
                        <div id="phoneAlert" class="alert alert-danger p-2 mt-1" style="display:none; font-size: 0.85rem;">Please add a valid phone number (10-12 digits)</div>

                        <div class="form-outline mt-3">
                            <input type="text" id="userEmail" name="email" class="form-control" autocomplete="email" />
                            <label class="form-label" for="userEmail">E-mail (optional)</label>
                            <div class="form-notch">
                                <div class="form-notch-leading"></div>
                                <div class="form-notch-middle"></div>
                                <div class="form-notch-trailing"></div>
                            </div>
                        </div>
                        <div id="mailAlert" class="alert alert-danger p-2 mt-1" style="display:none; font-size: 0.85rem;">Please add a valid e-mail address</div>
                        <div id="addStatus" class="alert p-2 mt-1" style="display:none;"></div>

                        <button type="submit" id="btnAddContact" class="btn btn-info w-100 mt-4 fw-semibold shadow-sm">
                            <i class="fas fa-plus me-1"></i> Add Contact
                        </button>
                    </form>
                </div>
            </div>

            <!-- Contacts Table & Pagination -->
            <div class="col-lg-8">
                <div class="table-responsive rounded-3 border" style="border-color: var(--table-border, rgba(255, 255, 255, 0.08)) !important;">
                    <table id="myTable" class="table table-striped align-middle mb-0" aria-label="Contacts list">
                        <thead class="tableh1">
                            <tr>
                                <th scope="col">Name</th>
                                <th scope="col">Phone</th>
                                <th scope="col">E-mail</th>
                                <th scope="col" class="col-1 text-center">Edit</th>
                                <th scope="col" class="col-1 text-center">Delete</th>
                            </tr>
                        </thead>

                        <tbody id="tableBody">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">
                                    <i class="fas fa-spinner fa-spin me-2"></i> Loading contacts from IndexedDB...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <nav class="pagination-nav mt-3" id="paginationNav" aria-label="Contact pages">
                    <ul class="pagination justify-content-center" id="paginationList">
                        <!-- Rendered dynamically -->
                    </ul>
                </nav>
            </div>

        </div>
    </div>

    <!-- Floating Toast Notification Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <footer class="text-center py-3 text-muted" style="font-size: 0.9rem;">
        Navid Ahmadzade &copy; 2026. All rights reserved.
    </footer>

    <!-- Scripts (Pure Client-side, Zero Server Dependency) -->
    <script src="../Assets/js/dexie.min.js"></script>
    <script src="../Assets/js/db.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
