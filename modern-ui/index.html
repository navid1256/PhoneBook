<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Phone Book Modern UI - Fast, accessible, and responsive contact management application powered by IndexedDB & Bootstrap 5.">
    <meta name="color-scheme" content="dark light">
    <title>Phone Book (Modern UI) - Bootstrap 5</title>

    <!-- Bootstrap 5.3.3 & Icons -->
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="../Assets/css/all.min.css" />
    <link rel="stylesheet" href="css/searchbox.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <div class="jumbotron jum">

        <header class="navbar flex-wrap">
            <div class="brand-section">
                <h3>
                    <span>Phone Book</span>
                    <i class="far fa-address-book"></i>
                </h3>

                <!-- Apple iOS Style Theme Toggle -->
                <button type="button" id="themeToggle" class="apple-switch" role="switch" aria-checked="false" aria-label="Toggle dark/light theme" title="Toggle theme">
                    <span class="apple-switch-track">
                        <i class="fas fa-sun apple-icon-sun" aria-hidden="true"></i>
                        <i class="fas fa-moon apple-icon-moon" aria-hidden="true"></i>
                        <span class="apple-switch-thumb"></span>
                    </span>
                </button>
            </div>

            <!-- Search Box -->
            <form id="searchForm" onsubmit="return false;" class="wrap">
                <div class="search">
                    <label for="myInput" class="visually-hidden">Search contacts</label>
                    <input type="text" id="myInput" class="searchTerm" name="search" placeholder="What Contact are you looking for?" aria-label="Search contacts" autocomplete="off" spellcheck="false">
                    <button type="submit" class="searchButton" aria-label="Search">
                        <i class="fa fa-search"></i>
                    </button>
                </div>
            </form>
        </header>

        <div class="row">

            <!-- Add Contact Form -->
            <div class="col-lg-4 inp">
                <h5 class="mt-2">Add New Contact</h5>

                <form id="addForm" onsubmit="return false;">
                    <div class="form-outline mt-3">
                        <input type="text" id="userName" name="name" class="form-control" autocomplete="name" />
                        <label class="form-label" for="userName">Name</label>
                        <div class="form-notch">
                            <div class="form-notch-leading"></div>
                            <div class="form-notch-middle"></div>
                            <div class="form-notch-trailing"></div>
                        </div>
                    </div>
                    <div id="nameAlert" class="alert alert-danger p-2" style="display:none;">Please add name</div>

                    <div class="form-outline mt-3">
                        <input type="number" id="userPhone" name="phone" class="form-control" min="0" max="999999999999" inputmode="numeric" autocomplete="tel" />
                        <label class="form-label" for="userPhone">Phone</label>
                        <div class="form-notch">
                            <div class="form-notch-leading"></div>
                            <div class="form-notch-middle"></div>
                            <div class="form-notch-trailing"></div>
                        </div>
                    </div>
                    <div id="phoneAlert" class="alert alert-danger p-2" style="display:none;">Please add a valid number</div>

                    <div class="form-outline mt-3">
                        <input type="text" id="userEmail" name="email" class="form-control" autocomplete="email" />
                        <label class="form-label" for="userEmail">E-mail (optional)</label>
                        <div class="form-notch">
                            <div class="form-notch-leading"></div>
                            <div class="form-notch-middle"></div>
                            <div class="form-notch-trailing"></div>
                        </div>
                    </div>
                    <div id="mailAlert" class="alert alert-danger p-2" style="display:none;">Please add a valid e-mail</div>
                    <div id="addStatus" class="alert alert-danger p-2" style="display:none;"></div>

                    <button type="submit" id="btnAddContact" class="btn btn-info w-100 btn1">Add</button>
                </form>
            </div>

            <!-- Contacts Table & Pagination -->
            <div class="col-lg-8">
                <div class="table-responsive">
                    <table id="myTable" class="table table-striped align-middle" aria-label="Contacts list">
                        <thead class="tableh1">
                            <tr>
                                <th scope="col">Name</th>
                                <th scope="col">Phone</th>
                                <th scope="col">E-mail</th>
                                <th scope="col" class="col-1 text-center">Edit</th>
                                <th scope="col" class="col-1 text-center">Delete</th>
                            </tr>
                        </thead>

                        <tbody id="tableBody">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">
                                    <i class="fas fa-spinner fa-spin me-2"></i> Loading contacts from IndexedDB...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <nav class="pagination-nav mt-3" id="paginationNav" aria-label="Contact pages">
                    <ul class="pagination justify-content-center" id="paginationList">
                        <!-- Rendered dynamically -->
                    </ul>
                </nav>
            </div>

        </div>
    </div>

    <!-- Floating Toast Notification Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <!-- Delete Confirmation Modal (HTML5 <dialog> with Glassmorphism & Keyboard Accessibility) -->
    <dialog id="deleteConfirmModal" class="confirm-modal" closedby="any" aria-labelledby="deleteModalTitle" aria-describedby="deleteModalDesc">
        <div class="confirm-modal-content">
            <div class="confirm-modal-icon">
                <i class="fas fa-trash-alt" aria-hidden="true"></i>
            </div>
            <h4 id="deleteModalTitle" class="confirm-modal-title">Delete Contact</h4>
            <p id="deleteModalDesc" class="confirm-modal-desc">Are you Sure You want to Delete this contact ?</p>
            <div class="confirm-modal-actions">
                <button type="button" id="confirmDeleteNo" class="btn confirm-btn-no">No</button>
                <button type="button" id="confirmDeleteYes" class="btn confirm-btn-yes">Yes</button>
            </div>
        </div>
    </dialog>

    <footer class="text-center py-3 text-muted" style="font-size: 0.9rem;">
        Navid Ahmadzade &copy; 2026. All rights reserved.
    </footer>

    <!-- Scripts (Pure Client-side, Zero Server Dependency) -->
    <script src="../Assets/js/dexie.min.js"></script>
    <script src="../Assets/js/db.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
